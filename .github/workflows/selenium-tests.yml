name: Selenium UI Automation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Execute Selenium Tests in Headless Mode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Selenium Tests (Headless)
        run: mvn -B clean test -Dheadless=true

      - name: Print Surefire Failure Reports
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            if [ -f "$f" ]; then
              echo "============================================================"
              echo "FILE: $f"
              echo "============================================================"
              cat "$f"
            fi
          done

      - name: Upload Test Reports & Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: |
            target/surefire-reports/**
            target/cucumber-report.html
            target/screenshots/**
            target/allure-results/**
